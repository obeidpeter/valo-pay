# No secrets, no Replit services, no real lender data. The first job is offline; the other two use a
# PostgreSQL 16 service container that exists only for the job and is discarded with the runner.
name: Source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: TypeScript, database boundary and pure tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies for high or critical advisories
        run: pnpm audit --prod --audit-level=high

      - name: Check TypeScript
        run: pnpm run typecheck

      - name: Check database boundary
        run: pnpm run check:db-boundary

      - name: Run pure tests
        run: pnpm run test:pure

      - name: Rehearse operational incident and recovery delivery locally
        run: |
          node scripts/monitor-valopay.test.mjs
          scripts/node_modules/.bin/tsx artifacts/api-server/tests/edit-versions.test.ts

      - name: Run golden tests (shared schema, retry engine, reconciliation)
        run: pnpm run test:golden

      - name: Measure complete synthetic workflows and assert aggregate correctness
        run: |
          scripts/node_modules/.bin/tsx artifacts/api-server/tests/workflow-performance.test.ts
          scripts/node_modules/.bin/tsx artifacts/api-server/tests/export-jobs.test.ts

      - name: Run console tests (pages in jsdom against the in-memory API)
        run: pnpm --filter @workspace/valopay run test

      - name: Build API bundle
        run: pnpm --filter @workspace/api-server run build

      - name: Build console
        run: pnpm --filter @workspace/valopay run build
        env:
          PORT: "5173"
          BASE_PATH: "/"

      - name: Install test browser
        run: pnpm --filter @workspace/valopay exec playwright install --with-deps chromium firefox webkit

      - name: Chromium, Firefox and WebKit browser workflows
        run: pnpm --filter @workspace/valopay run test:browser

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            artifacts/valo-pay/playwright-report
            artifacts/valo-pay/test-results
          retention-days: 7

  # The database-backed suites run against a PostgreSQL 16 that exists only for
  # this job: the schema is created in it with the development push and the
  # container is discarded with the runner.  No application secret, no real
  # database, no deploy; the export-stream suite (App Storage credentials) and
  # the HTTP suites (Replit development domain and Clerk) stay manual.
  database-checks:
    name: Repository and scheduler tests on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: valopay
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valopay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: development
      VALOPAY_RUN_INTEGRATION: "1"
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/valopay
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the schema in the job's throwaway database
        run: pnpm --filter @workspace/db run push

      - name: Run the repository and scheduled-close suites
        run: pnpm run test:integration

      - name: Rehearse pilot row-level isolation in an isolated schema
        run: scripts/node_modules/.bin/tsx artifacts/api-server/tests/pilot-rls.integration.test.ts
        env:
          VALOPAY_RUN_PILOT_RLS: "1"

      - name: Rehearse a measured synthetic backup and restore
        run: scripts/node_modules/.bin/tsx artifacts/api-server/tests/recovery-rehearsal.integration.test.ts
        env:
          VALOPAY_RUN_RECOVERY: "1"
          VALOPAY_REHEARSAL_REPORT: recovery-evidence.json

      - name: Preserve synthetic recovery measurements
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-evidence
          path: recovery-evidence.json
          retention-days: 14

  browser-database-checks:
    name: Browser workflows on the real API and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: valopay_browser_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d valopay_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/valopay_browser_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Create disposable browser database schema
        run: pnpm --filter @workspace/db run push
      - name: Build console
        run: pnpm --filter @workspace/valopay run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
      - name: Install Chromium
        run: pnpm --filter @workspace/valopay exec playwright install --with-deps chromium
      - name: Exercise real middleware, repositories and database persistence in a browser
        run: pnpm --filter @workspace/valopay run test:browser:database
      - name: Preserve browser database failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-database-failure-evidence
          path: |
            artifacts/valo-pay/playwright-database-report
            artifacts/valo-pay/test-results-database
          retention-days: 7
