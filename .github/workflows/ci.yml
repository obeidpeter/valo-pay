# Offline checks only: no database, no secrets, no Replit services, no real lender data.
name: Source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: TypeScript, database boundary and pure tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm run typecheck

      - name: Check database boundary
        run: pnpm run check:db-boundary

      - name: Run pure tests
        run: pnpm run test:pure

      - name: Run golden tests (shared schema, retry engine, reconciliation)
        run: pnpm run test:golden

      - name: Build API bundle
        run: pnpm --filter @workspace/api-server run build

      - name: Build console
        run: pnpm --filter @workspace/valopay run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
