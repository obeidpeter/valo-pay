<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valo Pay · Collections operations layer</title>
    <meta name="description" content="Track direct debit permissions, review retries and match payments to instalments with Valo Pay. Explore the sandbox with sample data. We never hold money." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Valo Pay" />
    <meta property="og:description" content="Know what was paid, what is due and what needs attention. Explore Valo Pay with sample data. We never hold money." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Valo Pay" />
    <meta name="twitter:description" content="Track collections, match payments and review customer records. Explore Valo Pay with sample data." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Light or dark before the first paint: the same rule and key as src/lib/theme.ts, which takes over once the app runs. -->
    <script>
      var choice = null;
      try { choice = localStorage.getItem('valopay-theme'); } catch (error) { /* storage blocked: the device decides */ }
      var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    </script>
    <!-- The console's two typefaces, asked for here so they download alongside the stylesheet rather than after it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
