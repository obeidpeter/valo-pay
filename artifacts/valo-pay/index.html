<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valo Pay · Collections, credit and cash operations</title>
    <meta
      name="description"
      content="Explore collections, pay-by-bank, credit evidence and business cash planning in Valo Pay. Working sample workflows for Nigerian lenders and SMEs. We never hold money."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Valo Pay" />
    <meta
      property="og:description"
      content="Collections, credit and cash. One clear workspace. Explore Valo Pay with sample data; live financial actions remain disabled."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Valo Pay" />
    <meta
      name="twitter:description"
      content="Explore Collections, Pay-by-bank, Credit Desk and Cash Desk with sample data. Valo Pay never holds money."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Light or dark before the first paint: the same rule and key as src/lib/theme.ts, which takes over once the app runs. -->
    <script>
      var choice = null;
      try { choice = localStorage.getItem('valopay-theme'); } catch (error) { /* storage blocked: the device decides */ }
      var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
